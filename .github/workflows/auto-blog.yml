name: Auto-Generate Blog Post

on:
  schedule:
    # Tuesday and Friday 00:00 UTC = 09:00 KST
    - cron: '0 0 * * 2'
    - cron: '0 0 * * 5'
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --disable-pip-version-check anthropic pyyaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project deps
        run: npm ci

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
        run: python scripts/generate-blog-post.py

      - name: Build verification (velite + next build)
        run: npx next build

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "sg-tech-bot"
          git config user.email "bot@sg-powertech.com"
          git add content/blog/
          if git diff --cached --quiet; then
            echo "No changes to commit — likely idempotent run"
            exit 0
          fi
          COMMIT_MSG=$(python3 <<'PY'
          import yaml, pathlib
          q = yaml.safe_load(pathlib.Path("content/blog/_queue.yaml").read_text())
          idx = q["next_index"] - 1
          t = q["topics"][idx]
          slug = t.get("published_slug", t["slug"])
          print(f"post: {t['title']}")
          print()
          print(f"Slug: {slug}")
          print(f"Segment: {t['segment']}")
          print(f"Angle: {t['angle']}")
          print()
          print("Auto-generated by GitHub Actions.")
          print()
          print("🤖 Generated with SG기전 auto-blog agent (Claude)")
          PY
          )
          git commit -m "$COMMIT_MSG"
          git push
