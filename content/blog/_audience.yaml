version: 1
reviewed_on: 2026-10-09
source: 사용자가 제공한 네이버 블로그 통계 화면 8장
measurement_window: unknown
limitations:
  - 화면에서 집계 기간과 조회수·검색어 비율의 상세 분모를 확인할 수 없다.
  - 조회수는 순방문자·문의·주문 수가 아니다. 글별 게시일도 다르다.
  - 전체 검색어와 모바일·PC 검색어 화면은 겹친다. 같은 검색어의 비율을 더하지 않는다.
  - 네이버 검색 수요는 ChatGPT 질문 후보를 찾는 근거이며 ChatGPT 인용 순위 자료가 아니다.
observations:
  - 전선·차단기 용량과 부스바 설명이 인기글 상위에 나타난다.
  - 함체 사이즈·아크릴 고정·방수등급 질문도 검색 유입 목록에 나타난다.
  - 네이버 통합검색 모바일·PC가 주요 유입 채널로 나타난다.
privacy: 공개 저장소에는 통계 화면 원본과 개별 조회수·유입 비율을 저장하지 않는다.
# Only this section enters the generation prompt; observations remain editorial notes.
editorial:
  audience_intents:
    - 전선·차단기 용량을 정할 때 필요한 부하·설치 조건 이해
    - 부스바 허용전류표의 조건과 기기 역할 비교
    - 분전함 사이즈·내부 공간·타공 치수 정리
    - 충전부 차폐·옥외 환경 등 목적에 맞는 제작 조건 확인
  business_facts:
    - 에스지기전은 맞춤 사이즈 박스·함체를 제작한다.
    - 에스지기전은 다양한 목적의 분전반·제어반을 맞춤 제조한다.
  writing_rules:
    - 질문에 먼저 답하고 역할·판단 이유·발주 때 필요한 정보까지 설명한다.
    - 정보성 글은 실제 주제와 관련된 제작 판단을 한 문단으로 연결한다.
    - 함체 가공과 부품·배선을 포함한 완성 분전반 제작의 발주 범위를 구분한다.
    - 제목·첫 답변·비교표·발주 체크리스트를 모바일에서도 쉽게 읽게 쓴다.
    - 통계 화면·조회수·검색어 비율·유입 채널은 공개 글에 쓰지 않는다.
  exclusions:
    - 맞춤제작 인덕션 검색어를 근거로 인덕션 제조 사업을 추가하지 않는다.
    - 모든 글에 공공기관 실적과 브랜드를 반복하지 않는다.
    - 특정 전선 굵기나 방수등급을 모든 제작 조건에 공통으로 추천하지 않는다.
research_backlog:
  - 전선 길이에 따른 전압강하와 제작 상담 때 필요한 거리 정보
  - 충전부 아크릴 커버의 역할과 고정·점검 조건
  - 옥외 함체의 IP 등급과 루버·타공·인입구 검토 항목
  - 접지선 굵기 선정에 필요한 설계 조건
  - 차단기 AF·AT·kA 표기를 부품 사양으로 전달하는 법
backlog_rule: 원문 근거를 검토한 뒤 기존 글 보강 또는 중복 없는 후속 글로 준비한다. 이 목록만으로 자동 발행하지 않는다.
