    reviewed_on: 2026-10-09
    review_by: 2027-01-07
    question: 누전 경보가 울리면 전원도 자동으로 차단되나요?
    business_bridge: 목적별 제어반 제작에서는 필요한 경보 표시와 보호 기능을 구분해 전달한다. 송도의 누전 경보 구성을 관련 예시로 짧게 설명한다.
    cta_headline: 경보·보호 요구에 맞는 제어반 제작 상담
    facts:
      - 누전 감시의 경보 출력과 보호 장치의 차단 동작은 기능과 결선을 구분해서 확인한다.
      - Schneider PM5500 자료는 누전 경보 시 알림 또는 디지털 출력 기능을 설명하고 안전 보호용 적용에 제한을 둔다.
      - 송도 제어반은 ZCT와 보호 기기를 구성하고 누전 경보 기능을 반영했다.
    restrictions:
      - 모든 감시 기기가 차단하거나 모든 경보가 전원을 유지한다고 단정하지 않는다.
      - 해당 PM5500을 SG기전 또는 송도에서 사용했다고 쓰지 않는다.
      - 감도·동작 시간 수치를 만들지 않는다. 송도의 실제 트립 조건을 추측하지 않는다.
    sources:
      - title: "Schneider Electric PM5500 User Manual: Residual current"
        url: https://productinfo.se.com/pm5500/595e2aa946e0fb0001f715da/PM5500%20user%20manual/English/PM5500SeriesUserManualv02_0000044889.ditamap/$/C_RCM_0000297741
        scope: 특정 감시 장치의 알림·출력과 안전 보호용 적용 제한
      - title: 송도 배수펌프 제어반 제작 구성
        url: https://www.sg-powertech.com/blog/2026-10-08-songdo-pump-panel-technical
        scope: 사용자 자료로 확인한 누전 경보 구성
  pump-panel-manual-auto-mode:
    status: reviewed
    reviewed_on: 2026-10-09
    review_by: 2027-01-07
    question: 배수펌프 제어반의 수동·자동 선택 스위치는 무엇을 바꾸나요?
    business_bridge: 펌프 제어반 맞춤 제작에서는 운전모드, 조작과 표시 요구를 먼저 정리한다. 시퀀스도와 결선도에 같은 운전 조건을 반영하면 기능 검토와 회로 추적을 돕는다.
    cta_headline: 운전 목적에 맞는 배수펌프 제어반 제작 상담
    facts:
      - 송도 전면 조작부에 펌프별 수동·자동 선택 스위치와 ON·OFF·FAULT 표시부를 배치했다.
      - 수동은 운전자 조작, 자동은 수위 신호에 따른 운전 방식을 선택하는 데 사용한다.
      - 운전모드, 보호 조건, 수위 조건을 시퀀스도와 단자대 결선도에 맞춰 정리했다.
    restrictions:
      - 수동 선택이 보호 기능을 해제한다고 설명하지 않는다.
      - 펌프 교번·동시 운전·고장 시 자동 전환은 확인된 자료가 없으므로 만들어 넣지 않는다.
    sources:
      - title: 송도 배수펌프 제어반 제작 구성
        url: https://www.sg-powertech.com/blog/2026-10-08-songdo-pump-panel-technical
        scope: 사용자 제공 제작 자료에 근거한 운전모드와 조작부 구성
  busbar-joint-torque-document:
    status: reviewed
    reviewed_on: 2026-10-09
    review_by: 2027-01-07
    question: 부스바 체결 토크를 볼트 크기만 보고 정해도 되나요?
    business_bridge: 맞춤 분전반의 기기 사양을 검토할 때 접속 조건에 맞는 제조사 자료를 확인한다. 발주 사양에 적용 모델을 정리하면 연결부의 기준을 검토하는 데 도움이 된다.
    cta_headline: 기기·접속 조건에 맞는 분전반 제작 상담
    facts:
      - 부스바 접속은 적용 기기와 접속 조건에 맞는 제조사 체결 사양을 확인한다.
      - Schneider Masterpact NT·NW 자료는 부스바 재질과 볼트·너트 등급 등 적용 조건을 명시한다.
      - 제조사 자료는 과도한 체결과 부족한 체결 모두 문제가 될 수 있음을 설명한다.
    restrictions:
      - 참고 문서의 토크 값을 SG 제작 제품의 공통 기준으로 복사하지 않는다.
      - 구체적인 Nm 수치를 제시하지 않는다. 제조사 문서에서 무엇을 확인할지 설명한다.
      - 통전 상태의 작업 절차를 안내하지 않는다.
    sources:
      - title: "Schneider Electric: What is the Tightening Torque on the Masterpact NT & NW Bars?"
        url: https://www.se.com/th/en/faqs/FA378983/
        scope: 특정 제품군의 부스바 접속 조건과 체결 사양 확인 원칙
  pump-approval-document-order:
    status: reviewed
    reviewed_on: 2026-10-09
    review_by: 2027-01-07
    question: 배수펌프 제어반 제작을 발주할 때 승인도서는 무엇을 준비하나요?
    business_bridge: 목적별 분전반 제작은 내부 기기·회로·조작 요구와 발주처 문서 요구를 함께 정리한다. 송도의 준비 목록을 개별 제작 범위를 정하는 예시로 활용한다.
    cta_headline: 승인도서 요구에 맞는 펌프 제어반 제작 상담
    facts:
      - 송도 제작에는 제작승인서, 외형도, 내부배치도, 단선결선도, 주·제어회로도, 단자대 결선도를 준비했다.
      - 펌프 제어 시퀀스도, 부하계산서, 주요 자재 사양서, 수위제어 사양서, 제품 카탈로그, 시험검사계획서도 준비했다.
      - 도면·사양·시퀀스·외부 접속 내용을 같은 제작 조건으로 맞추면 발주처의 검토를 돕는다.
    restrictions:
      - 이 12종은 송도 사례의 준비 범위이며 모든 기관에 의무인 목록으로 설명하지 않는다.
      - 승인·시험 완료를 주장하지 않는다. 원본 도면과 가격을 공개하지 않는다.
    sources:
      - title: 송도 배수펌프 제어반 구성과 승인도서 12종 준비
        url: https://www.sg-powertech.com/blog/2026-10-08-songdo-pump-panel-technical
        scope: 사용자가 직접 제공한 승인도서 준비 목록과 제작 범위
